<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540" role="img" aria-labelledby="title desc">
<title id="title">Anugrah Tripathi — AI Engineer and Software Developer</title>
<desc id="desc">A dark futuristic purple banner with an AA monogram, digital globe, code panel, and developer tagline.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070711"/><stop offset=".55" stop-color="#0c071b"/><stop offset="1" stop-color="#080b16"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e4b5ff"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#8b5cf6" stop-opacity=".35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#a855f7" opacity=".7"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="shine"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="540" rx="24" fill="url(#bg)"/>
<ellipse cx="800" cy="300" rx="620" ry="260" fill="url(#glow)"/>
<circle cx="70" cy="245" r="210" fill="none" stroke="#7c3aed" stroke-width="2" opacity=".5"/>
<circle cx="70" cy="245" r="185" fill="url(#dots)" opacity=".9"/>
<path d="M-65 235 Q75 25 200 115 T315 250 T165 420" fill="none" stroke="#8b5cf6" stroke-width="2" opacity=".65"/>
<path d="M0 465 L160 395 L245 448 L350 430 L430 490 L0 540Z" fill="#100d22" stroke="#4c1d95" stroke-opacity=".6"/>
<path d="M1120 0 H1600 V140 L1500 140 L1450 190 L1340 190 L1290 240 L1180 240" fill="none" stroke="#6d28d9" stroke-width="2" opacity=".6"/>
<path d="M1210 0 V60 H1270 M1320 0 V100 H1390 L1430 60 H1510" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity=".55"/>
<g transform="translate(675 55)">
  <rect width="250" height="190" rx="30" fill="#100a20" stroke="#7c3aed" stroke-width="1.5"/>
  <path d="M28 28 V54 H54 M196 164 H222 V138" fill="none" stroke="#a855f7" stroke-width="2"/>
  <circle cx="205" cy="38" r="4" fill="#c084fc"/><circle cx="40" cy="154" r="4" fill="#818cf8"/>
  <text x="125" y="126" font-family="Arial, Helvetica, sans-serif" font-size="100" font-weight="700" text-anchor="middle" fill="url(#violet)" filter="url(#shine)">A</text>
  <text x="154" y="126" font-family="Arial, Helvetica, sans-serif" font-size="75" font-weight="300" text-anchor="middle" fill="#f3e8ff">A</text>
</g>
<text x="800" y="315" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="700" letter-spacing="3" text-anchor="middle" fill="#f5f3ff">ANUGRAH <tspan fill="#c084fc">TRIPATHI</tspan></text>
<text x="800" y="365" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="5" text-anchor="middle" fill="#d8ccf8">AI ENGINEER  •  SOFTWARE DEVELOPER  •  PRODUCT BUILDER</text>
<rect x="380" y="397" width="840" height="48" rx="12" fill="#0c0918" stroke="#6d28d9" stroke-opacity=".8"/>
<text x="800" y="427" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" fill="#e9ddff">Building AI-powered applications, intelligent agents, and useful software.</text>
<g transform="translate(1290 270) rotate(-7)">
  <rect width="245" height="150" rx="12" fill="#0b0c19" stroke="#a855f7" stroke-width="2"/>
  <path d="M0 28 H245" stroke="#6d28d9"/>
  <circle cx="16" cy="14" r="3" fill="#c084fc"/><circle cx="28" cy="14" r="3" fill="#8b5cf6"/><circle cx="40" cy="14" r="3" fill="#6d28d9"/>
  <text x="18" y="58" font-family="monospace" font-size="12" fill="#c084fc">from agents import Agent</text>
  <text x="18" y="82" font-family="monospace" font-size="12" fill="#93c5fd">agent = Agent(</text>
  <text x="30" y="103" font-family="monospace" font-size="12" fill="#f0abfc">name="Anugrah"</text>
  <text x="18" y="124" font-family="monospace" font-size="12" fill="#93c5fd">)</text>
</g>
<path d="M350 485 H1250" stroke="#8b5cf6" stroke-width="2" opacity=".7" filter="url(#shine)"/>
<circle cx="360" cy="485" r="4" fill="#c084fc"/><circle cx="1240" cy="485" r="4" fill="#c084fc"/>
